name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno lint
      - run: deno fmt --check
      - run: deno task test
      # Dogfood: drift-gate gates its own exported surface.
      - run: deno task drift check --entry mod.ts --golden .drift/surface.json
      - run: npx jsr publish --dry-run
